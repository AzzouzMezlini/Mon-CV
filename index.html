<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- SEO de base -->
        <title>Azzouz Mezlini — Data Engineer / Développeur SQL & Data</title>
        <meta
            name="description"
            content="CV interactif d'Azzouz Mezlini, Data Engineer & Développeur SQL. Spécialiste en SQL avancé, modélisation décisionnelle, dbt, Cube.dev, PostgreSQL et ETL."
        />
        <meta
            name="keywords"
            content="Data Engineer, Développeur SQL, PostgreSQL, dbt, Cube.dev, ETL, Data Warehouse, Grenoble, Meylan"
        />
        <meta name="author" content="Azzouz Mezlini" />
        <meta name="robots" content="index, follow" />

        <!-- Open Graph (LinkedIn, WhatsApp, Facebook, Slack) -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://azzouzmezlini.github.io/" />
        <!-- Remplace par ton URL exacte -->
        <meta
            property="og:title"
            content="Azzouz Mezlini — Data Engineer / Développeur SQL"
        />
        <meta
            property="og:description"
            content="Spécialiste en SQL avancé, modélisation décisionnelle et pipelines ETL. Découvrez mon parcours, mes compétences et mes projets."
        />
        <meta
            property="og:image"
            content="https://azzouzmezlini.github.io/assets/preview-card.png"
        />
        <!-- URL absolue obligatoire -->
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:locale" content="fr_FR" />

        <!-- Twitter Cards -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta
            name="twitter:title"
            content="Azzouz Mezlini — Data Engineer / Développeur SQL"
        />
        <meta
            name="twitter:description"
            content="Spécialiste en SQL avancé, modélisation décisionnelle et pipelines ETL. Découvrez mon parcours, mes compétences et mes projets."
        />
        <meta
            name="twitter:image"
            content="https://azzouzmezlini.github.io/assets/preview-card.png"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <!-- BARRE DE CONTRÔLE (Écran uniquement) -->
        <div class="controls-bar">
            <!-- Groupe de gauche : Options d'affichage -->
            <div class="controls-group">
                <span class="controls-label">Mode d'affichage :</span>
                <div class="controls-options">
                    <label class="radio-option">
                        <input
                            type="radio"
                            name="viewMode"
                            value="compact"
                            checked
                            onchange="renderExperiences()"
                        />
                        <span
                            >Vue Synthétique A4
                            <small>(7 dernières missions)</small></span
                        >
                    </label>
                    <label class="radio-option">
                        <input
                            type="radio"
                            name="viewMode"
                            value="full"
                            onchange="renderExperiences()"
                        />
                        <span>Vue Complète</span>
                    </label>
                </div>
            </div>

            <!-- Groupe de droite : Actions -->
            <div class="controls-actions">
                <button class="btn-print" onclick="window.print()">
                    📄 Imprimer / Export PDF
                </button>
                <label
                    class="theme-switch"
                    for="theme-toggle"
                    aria-label="Activer le mode sombre"
                >
                    <span class="theme-switch-label">
                        <span class="theme-icon-light">☀️</span>
                        <span class="theme-icon-dark">🌙</span>
                        <span class="theme-switch-text">Mode sombre</span>
                    </span>
                    <div class="switch-wrapper">
                        <input type="checkbox" id="theme-toggle" />
                        <span class="switch-slider"></span>
                    </div>
                </label>
            </div>
        </div>

        <!-- PAGE A4 UNIQUE -->
        <div class="page">
            <!-- HEADER -->
            <header class="header">
                <div class="header-main">
                    <h1 id="user-name">Chargement...</h1>
                    <div class="title-badge" id="user-title"></div>
                </div>
                <div class="contact-grid" id="contact-list"></div>
            </header>

            <!-- CARTE PROFIL -->
            <section class="profile-card" id="profile-text"></section>

            <!-- BANDEAU COMPÉTENCES (ÉCRAN UNIQUEMENT) -->
            <section id="sec-skills-top" class="skills-banner">
                <div class="section-title">Compétences Clefs</div>
                <div id="skills-container-top"></div>
            </section>

            <!-- LAYOUT 2 COLONNES (UNIQUE) -->
            <div class="layout">
                <!-- Main : Expériences -->
                <main class="col-main">
                    <section class="exp-section">
                        <div class="section-title">Parcours Professionnel</div>
                        <div
                            class="exp-container"
                            id="experience-container"
                        ></div>
                    </section>
                </main>

                <!-- Side : Sidebar -->
                <aside class="col-side">
                    <!-- Compétences (IMPRESSION UNIQUEMENT) -->
                    <section id="sec-skills-side" class="skills-sidebar">
                        <div class="section-title">Compétences Clefs</div>
                        <div id="skills-container-side"></div>
                    </section>

                    <section id="sec-projects">
                        <div class="section-title">Portfolio Technique</div>
                        <div id="projects-container"></div>
                    </section>

                    <section id="sec-education">
                        <div class="section-title">Formations</div>
                        <div id="education-container"></div>
                    </section>
                </aside>
            </div>

            <!-- FOOTER -->
            <footer class="footer">
                <span>CV généré dynamiquement via JSON & GitHub Pages</span>
                <span>Azzouz Mezlini — 2026</span>
            </footer>
        </div>

        <script type="module" src="js/app.js"></script>
    </body>
</html>
