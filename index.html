<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Azzouz Mezlini - Data Engineer & Développeur SQL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- BARRE DE CONTRÔLE (Écran uniquement) -->
    <div class="controls-bar">
        <div>
            <strong>Mode d'affichage :</strong>
            <label style="display:inline-flex; margin-left:10px;">
                <input type="radio" name="viewMode" value="compact" checked onchange="renderExperiences()"> Vue Synthétique A4 (7 postes clefs)
            </label>
            <label style="display:inline-flex; margin-left:10px;">
                <input type="radio" name="viewMode" value="full" onchange="renderExperiences()"> Vue Complète (13 postes)
            </label>
        </div>
        <button class="btn-print" onclick="window.print()">Imprimer / Export PDF</button>
    </div>

    <!-- PAGE A4 UNIQUE -->
    <div class="page">

        <!-- HEADER -->
        <header class="header">
            <div class="header-main">
                <h1 id="user-name">Chargement...</h1>
                <div class="title-badge" id="user-title"></div>
            </div>
            <div class="contact-grid" id="contact-list"></div>
        </header>

        <!-- CARTE PROFIL -->
        <section class="profile-card" id="profile-text"></section>

        <!-- BANDEAU COMPÉTENCES (ÉCRAN UNIQUEMENT) -->
        <section id="sec-skills-top" class="skills-banner">
            <div class="section-title">Compétences Clefs</div>
            <div id="skills-container-top"></div>
        </section>

        <!-- LAYOUT 2 COLONNES (UNIQUE) -->
        <div class="layout">

            <!-- Main : Expériences -->
            <main class="col-main">
                <section class="exp-section">
                    <div class="section-title">Parcours Professionnel</div>
                    <div class="exp-container" id="experience-container"></div>
                </section>
            </main>

            <!-- Side : Sidebar -->
            <aside class="col-side">
                <!-- Compétences (IMPRESSION UNIQUEMENT) -->
                <section id="sec-skills-side" class="skills-sidebar">
                    <div class="section-title">Compétences Clefs</div>
                    <div id="skills-container-side"></div>
                </section>

                <section id="sec-projects">
                    <div class="section-title">Portfolio Technique</div>
                    <div id="projects-container"></div>
                </section>

                <section id="sec-education">
                    <div class="section-title">Formations</div>
                    <div id="education-container"></div>
                </section>
            </aside>

        </div>

        <!-- FOOTER -->
        <footer class="footer">
            <span>CV généré dynamiquement via JSON & GitHub Pages</span>
            <span>Azzouz Mezlini — 2026</span>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
