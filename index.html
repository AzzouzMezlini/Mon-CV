<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Azzouz Mezlini - Data Engineer & Développeur SQL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <!-- HEADER DESIGN -->
        <header class="header">
            <div class="header-main">
                <h1 id="user-name">Chargement...</h1>
                <div class="title-badge" id="user-title"></div>
            </div>
            <div class="contact-grid" id="contact-list"></div>
        </header>

        <!-- LAYOUT DEUX COLONNES FLUIDES -->
        <div class="layout">
            <!-- Sidebar gauche : Compétences & Formations -->
            <aside class="col-side">
                <div>
                    <div class="section-title">Compétences</div>
                    <div id="skills-container"></div>
                </div>
                <div style="margin-top: 10px;">
                    <div class="section-title">Formations</div>
                    <div id="education-container"></div>
                </div>
            </aside>

            <!-- Contenu principal droit : Profil, Expériences, Portfolio -->
            <main class="col-main">
                <div class="profile-card" id="profile-text"></div>

                <section class="exp-section">
                    <div class="section-title">Parcours Professionnel</div>
                    <div class="exp-container" id="experience-container"></div>
                </section>

                <section style="margin-top: 8px;">
                    <div class="section-title">Portfolio Technique</div>
                    <div id="projects-container"></div>
                </section>
            </main>
        </div>

        <!-- FOOTER DISCRET -->
        <footer class="footer">
            <span>CV généré dynamiquement via JSON & GitHub Pages</span>
            <span>Azzouz Mezlini — 2026</span>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
