name: Generate Dynamic README

on:
  push:
    paths:
      - 'cv-data.json'
      - 'template.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Generate README
      run: |
        import json
        
        # Charger les données JSON
        with open('cv-data.json', 'r', encoding='utf-8') as f:
            data = json.load(f)
            
        # Charger le template HTML/Markdown
        with open('template.md', 'r', encoding='utf-8') as f:
            template = f.read()
            
        coords = data['coordonnees']
        
        # Remplacement des variables de base
        template = template.replace('id="gh-name">Chargement...', f'id="gh-name">{coords["nom"]}')
        template = template.replace('id="gh-title">', f'id="gh-title">{data["statut"]}')
        template = template.replace('id="gh-profile">', f'id="gh-profile">{data["profil"]}')
        
        # Génération dynamique des listes HTML
        contact_html = f"""
          <li>📍 {coords['adresse']}</li>
          <li>✉️ <a href="mailto:{coords['email']}">{coords['email']}</a></li>
          <li>🚗 {coords['permis']}</li>
          <li>🔗 <a href="https://{coords['linkedin']}" target="_blank">LinkedIn</a></li>
          <li>💻 <a href="https://{coords['github']}" target="_blank">GitHub</a></li>
        """
        template = template.replace('<ul id="gh-contact"></ul>', f'<ul id="gh-contact">{contact_html}</ul>')
        
        skills_html = "".join([f'<div class="cv-skill-group"><h4>{c["categorie"]}</h4><p>{", ".join(c["liste"])}</p></div>' for c in data['competences']])
        template = template.replace('<div id="gh-skills"></div>', f'<div id="gh-skills">{skills_html}</div>')
        
        exp_html = ""
        for exp in data['experiences']:
            bullets = "".join([f'<li>{m}</li>' for m in exp['missions']])
            exp_html += f"""
            <div class="cv-item">
              <div class="cv-item-header"><span class="cv-item-title">{exp['poste']}</span><span class="cv-item-date">{exp['periode']}</span></div>
              <div class="cv-item-sub">{exp['entreprise']}</div>
              <ul class="cv-item-bullets">{bullets}</ul>
            </div>
            """
        template = template.replace('<div id="gh-experience"></div>', f'<div id="gh-experience">{exp_html}</div>')
        
        edu_html = "".join([f'<div class="cv-item"><div class="cv-item-header"><span class="cv-item-title">{e["diplome"]}</span><span class="cv-item-date">{e["annee"]}</span></div><div class="cv-item-sub">{e["institution"]}</div></div>' for e in data['formations']])
        template = template.replace('<div id="gh-education"></div>', f'<div id="gh-education">{edu_html}</div>')
        
        # Sauvegarde du rendu final dans README.md
        with open('README.md', 'w', encoding='utf-8') as f:
            f.read() # Nettoyage
            f.write(template)
      shell: python

    - name: Commit and Push changes
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        git add README.md
        git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Update dynamic README.md"
        git push
